<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https://qbfmozumntequvecttfs.supabase.co https://images.unsplash.com https://plus.unsplash.com https://images.pexels.com; media-src 'self' blob: https://qbfmozumntequvecttfs.supabase.co; connect-src https://qbfmozumntequvecttfs.supabase.co; base-uri 'none'; form-action 'self'; object-src 'none'; manifest-src 'self'; upgrade-insecure-requests">
<title>Imóvel | Vitrine</title>
<meta name="description" content="Veja fotos, detalhes e fale direto com o corretor pelo WhatsApp.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E10">
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Vitrine">
<meta property="og:title" content="Imóvel | Vitrine">
<meta property="og:description" content="Veja fotos, detalhes e fale direto com o corretor pelo WhatsApp.">
<meta property="og:image" content="https://vitrinecorretores.github.io/og-vitrine.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Playfair+Display:wght@600;700&display=swap">
<style>
  :root{--bg:#F6F5F1; --card:#FFFFFF; --ink:#141414; --muted:#6B6B6B; --line:#E7E4DC; --accent:#B8893B; --dark:#0E0E10; --wa:#1FAF5A;}
  *{box-sizing:border-box;}
  html,body{margin:0; background:var(--bg); color:var(--ink); font-family:"Geist",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:16px; line-height:1.55; -webkit-font-smoothing:antialiased;}
  button{font-family:inherit;}
  [hidden]{display:none !important;}
  .msg{text-align:center; padding:120px 16px; color:var(--muted);}

  /* galeria em tela cheia no topo */
  .hero{position:relative; width:100%; height:min(72vh,620px); background:var(--dark); overflow:hidden;}
  .slides{display:flex; height:100%; overflow-x:auto; scroll-snap-type:x mandatory; scrollbar-width:none;}
  .slides::-webkit-scrollbar{display:none;}
  .slides img{flex:none; width:100%; height:100%; object-fit:cover; scroll-snap-align:start; cursor:zoom-in;}
  .hero::after{content:""; position:absolute; inset:0; pointer-events:none; background:linear-gradient(180deg,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 60%,rgba(0,0,0,.55) 100%);}
  .topbar{position:absolute; top:0; left:0; right:0; z-index:2; display:flex; justify-content:space-between; align-items:center; padding:calc(14px + env(safe-area-inset-top)) 16px 14px;}
  .brand{color:#fff; font-weight:800; letter-spacing:-.02em; font-size:15px; opacity:.92;}
  .icon-btn{width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.92); color:var(--ink); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 4px 14px rgba(0,0,0,.18);}
  .icon-btn svg{width:20px; height:20px;}
  .nav{position:absolute; top:50%; z-index:2; transform:translateY(-50%);}
  .nav.prev{left:12px;} .nav.next{right:12px;}
  .count{position:absolute; z-index:2; left:16px; bottom:16px; color:#fff; font-size:13px; font-weight:600; background:rgba(0,0,0,.45); backdrop-filter:blur(6px); padding:5px 11px; border-radius:20px;}
  .ver-fotos{position:absolute; z-index:2; right:16px; bottom:16px; color:var(--ink); background:#fff; border:0; font-weight:700; font-size:13px; padding:8px 14px; border-radius:20px; cursor:pointer;}

  .wrap{max-width:760px; margin:0 auto; padding:0 16px 140px;}
  .head{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:22px 20px; margin-top:-36px; position:relative; z-index:3; box-shadow:0 10px 30px rgba(20,20,20,.06);}
  .tags{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:10px;}
  .tag{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; padding:5px 10px; border-radius:20px; background:#F1ECE1; color:#7A5A22;}
  .tag.escura{background:var(--dark); color:#fff;}
  h1{font-family:"Playfair Display",Georgia,serif; font-size:clamp(26px,6vw,34px); line-height:1.15; margin:0 0 8px; letter-spacing:-.01em; text-wrap:balance;}
  .loc{display:flex; align-items:center; gap:6px; color:var(--muted); margin:0 0 16px; font-size:15px;}
  .loc svg{width:16px; height:16px; flex:none;}
  .preco-box{display:flex; align-items:baseline; justify-content:space-between; gap:10px; flex-wrap:wrap; border-top:1px solid var(--line); padding-top:14px;}
  .preco-box small{color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; font-weight:700; display:block;}
  .preco{font-size:30px; font-weight:800; letter-spacing:-.02em; margin:0;}

  .specs{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:10px; margin:16px 0 0;}
  .spec{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:14px; display:flex; gap:10px; align-items:center;}
  .spec svg{width:26px; height:26px; color:var(--accent); flex:none;}
  .spec b{display:block; font-size:19px; line-height:1.1;} .spec span{font-size:12px; color:var(--muted);}

  .sec{background:var(--card); border:1px solid var(--line); border-radius:22px; padding:20px; margin-top:14px;}
  .sec h2{font-family:"Playfair Display",Georgia,serif; font-size:21px; margin:0 0 10px;}
  .desc{margin:0; white-space:pre-line; color:#2B2B2B;}
  .desc.curta{max-height:9.5em; overflow:hidden; -webkit-mask-image:linear-gradient(#000 60%,transparent);}
  .mais{margin-top:8px; background:none; border:0; color:var(--accent); font-weight:700; padding:0; cursor:pointer; font-size:15px;}
  .difs{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px; padding:0; margin:0; list-style:none;}
  .difs li{display:flex; gap:10px; align-items:flex-start;}
  .difs li::before{content:"✓"; flex:none; width:22px; height:22px; border-radius:50%; background:#F1ECE1; color:#7A5A22; font-weight:800; font-size:13px; display:inline-flex; align-items:center; justify-content:center; margin-top:1px;}

  .corretor{display:flex; gap:14px; align-items:center;}
  .avatar{width:56px; height:56px; border-radius:50%; background:var(--dark); color:#fff; font-weight:800; font-size:20px; display:flex; align-items:center; justify-content:center; flex:none;}
  .corretor small{color:var(--muted); display:block; font-size:13px;}
  .corretor strong{font-size:18px; display:block;}

  .share{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
  .share button,.share a{display:flex; align-items:center; justify-content:center; gap:8px; padding:13px 14px; border-radius:14px; border:1px solid var(--line); background:#fff; color:var(--ink); font-weight:700; font-size:15px; cursor:pointer; text-decoration:none;}
  .share svg{width:18px; height:18px;}

  .cta-bar{position:fixed; left:0; right:0; bottom:0; z-index:10; padding:12px 16px calc(12px + env(safe-area-inset-bottom)); background:rgba(246,245,241,.92); backdrop-filter:blur(10px); border-top:1px solid var(--line);}
  .cta-in{max-width:760px; margin:0 auto; display:flex; gap:10px;}
  .cta{flex:1; display:flex; align-items:center; justify-content:center; gap:8px; background:var(--wa); color:#fff; font-weight:800; font-size:17px; padding:15px; border-radius:16px; text-decoration:none; border:0;}
  .cta svg{width:22px; height:22px;}
  .btn-share{width:56px; flex:none; border-radius:16px; border:1px solid var(--line); background:#fff; display:flex; align-items:center; justify-content:center; cursor:pointer;}
  .btn-share svg{width:22px; height:22px;}

  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%); background:var(--dark); color:#fff; padding:10px 16px; border-radius:12px; font-size:14px; z-index:20;}

  .lb{position:fixed; inset:0; z-index:30; background:rgba(0,0,0,.95); display:flex; flex-direction:column;}
  .lb-top{display:flex; justify-content:space-between; align-items:center; color:#fff; padding:calc(12px + env(safe-area-inset-top)) 16px 12px;}
  .lb .slides{flex:1; height:auto;}
  .lb .slides img{object-fit:contain; cursor:default;}
  @media (min-width:900px){ .hero{height:560px;} }
  :focus-visible{outline:3px solid var(--accent); outline-offset:2px;}
</style>
</head>
<body>
<div id="msg" class="msg">Carregando imóvel…</div>
<div id="conteudo" hidden>
  <header class="hero" id="hero">
    <div class="topbar"><span class="brand">Vitrine</span>
      <button class="icon-btn" id="share-top" aria-label="Compartilhar este imóvel"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg></button>
    </div>
    <div class="slides" id="slides"></div>
    <button class="icon-btn nav prev" id="prev" aria-label="Foto anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m15 18-6-6 6-6"/></svg></button>
    <button class="icon-btn nav next" id="next" aria-label="Próxima foto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <span class="count" id="count"></span>
    <button class="ver-fotos" id="ver-fotos">Ver todas as fotos</button>
  </header>

  <main class="wrap">
    <section class="head">
      <div class="tags" id="tags"></div>
      <h1 id="titulo"></h1>
      <p class="loc" id="loc-p"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span id="loc"></span></p>
      <div class="preco-box"><div><small id="preco-lb">Valor</small><p class="preco" id="preco"></p></div></div>
    </section>

    <div class="specs" id="specs"></div>

    <section class="sec">
      <h2>Sobre o imóvel</h2>
      <p class="desc" id="desc"></p>
      <button class="mais" id="mais" hidden>Ler descrição completa</button>
    </section>

    <section class="sec" id="sec-dif" hidden><h2>Diferenciais</h2><ul class="difs" id="difs"></ul></section>

    <section class="sec">
      <div class="corretor"><div class="avatar" id="avatar"></div><div><small>Corretor responsável</small><strong id="c-nome"></strong><small id="c-creci"></small></div></div>
    </section>

    <section class="sec">
      <h2>Gostou? Compartilhe</h2>
      <p style="margin:0 0 12px;color:var(--muted)">Mande este imóvel para quem vai decidir com você.</p>
      <div class="share">
        <a id="sh-wa" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.7 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.1-1.2-.2-.2-.4-.3z"/></svg>WhatsApp</a>
        <button id="sh-copiar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar link</button>
        <button id="sh-mais"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg>Outros apps</button>
      </div>
    </section>
  </main>
</div>

<div class="cta-bar" id="cta-bar" hidden><div class="cta-in">
  <a class="cta" id="cta" href="#" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm4.5 12.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.7 3.2.6.5-.1 1.5-.6 1.7-1.2s.2-1.1.1-1.2-.2-.2-.4-.3z"/></svg>Falar com o corretor</a>
  <button class="btn-share" id="share-bar" aria-label="Compartilhar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M12 3v13"/><path d="m7 8 5-5 5 5"/></svg></button>
</div></div>

<div class="lb" id="lb" hidden role="dialog" aria-label="Fotos do imóvel">
  <div class="lb-top"><span id="lb-count"></span><button class="icon-btn" id="lb-x" aria-label="Fechar fotos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div class="slides" id="lb-slides"></div>
</div>
<script src="imovel.js?v=20261028-novo"></script>
</body>
</html>
